name: Daily Stocks, AI & Biotech Digest

on:
  schedule:
    # Target: 8:00 AM Singapore Time (UTC+8) = 00:00 UTC.
    # GitHub has been delaying this workflow by ~4 hours (observed: scheduled
    # 02:00 UTC, actual runs 05:47-06:39 UTC) — top-of-hour crons queue behind
    # everyone else's. Scheduled 4h10m early at an off-round minute (19:50 UTC
    # the previous day) to land close to 00:00 UTC / 8am SGT despite the delay.
    - cron: "50 19 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  send-digest:
    name: Fetch, Summarize & Send
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Opt into Node.js 24 early for actions/checkout@v4 and actions/setup-python@v5,
    # which were built on Node.js 20 (deprecated June 2 2026 / removed Sept 16 2026).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python digest/digest.py
